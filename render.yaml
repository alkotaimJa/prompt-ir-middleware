# Render Blueprint: one Docker web service + one managed PostgreSQL database.
# Deploy: Render dashboard → New → Blueprint → select this repository.
# You will be prompted for the secret values marked "sync: false".
databases:
  - name: prompt-study-db
    plan: free
    databaseName: prompt_study
    user: prompt_study

services:
  - type: web
    name: prompt-study
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prompt-study-db
          property: connectionString
      - key: OPENAI_KEY
        sync: false
      - key: ANTHROPIC_KEY
        sync: false
      - key: GEMINI_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: EXPERIMENT_ACCESS_CODE
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-5
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=75 -XX:+UseSerialGC"
