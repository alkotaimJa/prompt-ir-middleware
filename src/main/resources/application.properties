spring.application.name=GPT

# OpenAI (GPT-4o - latest stable GPT model)
spring.ai.openai.api-key=${OPENAI_KEY:${KEY:}}
spring.ai.openai.chat.options.model=gpt-4o

# Anthropic (Claude 3.5 Sonnet - latest stable Claude 3.x model)
spring.ai.anthropic.api-key=${ANTHROPIC_KEY:}
spring.ai.anthropic.chat.options.model=claude-3-5-sonnet-20241022

# Google GenAI (Gemini 1.5 Pro - latest stable Gemini 1.x model)
spring.ai.google.genai.api-key=${GEMINI_KEY:}
spring.ai.google.genai.chat.options.model=gemini-1.5-pro-002
