spring.application.name=prompt-ir-middleware
server.port=${PORT:8080}
# Trust X-Forwarded-* headers from the hosting platform's proxy (Render, Railway, ...)
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/csv

# ── LLM providers ───────────────────────────────────────────────────────────
# Keys come from environment variables. The "not-set" fallback lets the app
# start without keys (calls then fail gracefully, or use EXPERIMENT_MOCK_LLM=true).
spring.ai.openai.api-key=${OPENAI_KEY:${KEY:not-set}}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}

spring.ai.anthropic.api-key=${ANTHROPIC_KEY:not-set}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-opus-4-5}
spring.ai.anthropic.chat.options.max-tokens=${ANTHROPIC_MAX_TOKENS:2048}

spring.ai.google.genai.api-key=${GEMINI_KEY:not-set}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-2.5-flash}

# ── Persistence ─────────────────────────────────────────────────────────────
# Production: set DATABASE_URL (postgres://user:pass@host:5432/db) — see
# DatabaseUrlEnvironmentPostProcessor. Local default: file-based H2 in ./data.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/experiment;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ── Experiment (raw vs transformed) ─────────────────────────────────────────
experiment.mock-llm=${EXPERIMENT_MOCK_LLM:false}
experiment.access-code=${EXPERIMENT_ACCESS_CODE:}
experiment.admin-token=${ADMIN_TOKEN:}
experiment.providers=${EXPERIMENT_PROVIDERS:openai,claude,gemini}
experiment.max-prompt-chars=${EXPERIMENT_MAX_PROMPT_CHARS:4000}
experiment.max-trials-per-participant=${EXPERIMENT_MAX_TRIALS:25}
experiment.max-trials-per-ip-per-hour=${EXPERIMENT_MAX_TRIALS_PER_IP_HOUR:40}
experiment.call-timeout-seconds=${EXPERIMENT_CALL_TIMEOUT:120}
experiment.min-reason-chars=${EXPERIMENT_MIN_REASON_CHARS:3}

# ── Actuator: health endpoint for the hosting platform ──────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ── Prompt Transformation Pipeline ──────────────────────────────────────────

# T1: Instruction Scaffolding — prefix and suffix wrapped around the raw user message
pipeline.scaffolding.prefix=Your task is:
pipeline.scaffolding.suffix=Please complete this task clearly and accurately.

# T2: Role Detection — automatic persona inference from message content
pipeline.role.detection.enabled=true

# T3: Role Conditioning — default persona applied when the request omits a role and no role was auto-detected
pipeline.role.default=a helpful and precise AI assistant

# T8: Token Budgeting — maximum token budget per provider (characters / 4 ≈ tokens)
pipeline.token.budget.openai=128000
pipeline.token.budget.claude=200000
pipeline.token.budget.gemini=1000000
