spring.application.name=prompt-ir-middleware
server.port=${PORT:8080}
# Trust X-Forwarded-* headers from the hosting platform's proxy (Render, Railway, ...)
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,text/csv

# ── LLM providers ───────────────────────────────────────────────────────────
# Keys come from environment variables. The "not-set" fallback lets the app
# start without keys (calls then fail gracefully, or use EXPERIMENT_MOCK_LLM=true).
spring.ai.openai.api-key=${OPENAI_KEY:${KEY:not-set}}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o}

spring.ai.anthropic.api-key=${ANTHROPIC_KEY:not-set}
spring.ai.anthropic.chat.options.model=${ANTHROPIC_MODEL:claude-opus-4-5}
spring.ai.anthropic.chat.options.max-tokens=${ANTHROPIC_MAX_TOKENS:2048}

spring.ai.google.genai.api-key=${GEMINI_KEY:not-set}
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.8-flash}

# Fail fast when a provider errors (HTTP 5xx/timeouts): at most 2 attempts with short
# backoff, so one failing provider cannot hold up a trial. Other providers are unaffected.
spring.ai.retry.max-attempts=${LLM_MAX_ATTEMPTS:2}
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s

# ── Persistence ─────────────────────────────────────────────────────────────
# Production: set DATABASE_URL (postgres://user:pass@host:5432/db) — see
# DatabaseUrlEnvironmentPostProcessor. Local default: file-based H2 in ./data.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:file:./data/experiment;MODE=PostgreSQL;AUTO_SERVER=TRUE}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ── Experiment (raw vs transformed) ─────────────────────────────────────────
experiment.mock-llm=${EXPERIMENT_MOCK_LLM:false}
experiment.access-code=${EXPERIMENT_ACCESS_CODE:}
experiment.admin-token=${ADMIN_TOKEN:}
experiment.providers=${EXPERIMENT_PROVIDERS:openai,claude,gemini}
experiment.max-prompt-chars=${EXPERIMENT_MAX_PROMPT_CHARS:4000}
experiment.max-trials-per-participant=${EXPERIMENT_MAX_TRIALS:25}
experiment.max-trials-per-ip-per-hour=${EXPERIMENT_MAX_TRIALS_PER_IP_HOUR:40}
experiment.call-timeout-seconds=${EXPERIMENT_CALL_TIMEOUT:120}
experiment.min-reason-chars=${EXPERIMENT_MIN_REASON_CHARS:3}
# Clarifying-context step: options generated by the first provider that succeeds (rule-based fallback).
experiment.context-step-enabled=${EXPERIMENT_CONTEXT_STEP:true}
experiment.context-generator-providers=${EXPERIMENT_CONTEXT_PROVIDERS:gemini,openai,claude}
experiment.context-timeout-seconds=${EXPERIMENT_CONTEXT_TIMEOUT:20}
# Mock mode only: simulate HTTP 500 from these providers (e.g. "claude") to demonstrate fault tolerance.
experiment.mock-fail-providers=${EXPERIMENT_MOCK_FAIL_PROVIDERS:}

# ── Actuator: health endpoint for the hosting platform ──────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# ── Prompt Transformation Pipeline (v2) ─────────────────────────────────────
# Content layers (can be disabled for ablation, comma-separated ids):
#   task-classification, constraint-extraction, instruction-scaffolding, role-detection,
#   role-conditioning, output-format, length-control, context-delimitation, response-guidelines
# Infrastructure stages (always on): ir-normalisation, provider-compilation, token-budgeting
# The active configuration is stored with every trial as its pipeline version.
pipeline.disabled-layers=${PIPELINE_DISABLED_LAYERS:}

# T4: Role Detection (conservative, domain-specific; no persona when nothing matches)
pipeline.role.detection.enabled=true

# T5: Role Conditioning default persona (empty = none; generic personas do not reliably help)
pipeline.role.default=

# T7: Length Control guidance (applied unless the user stated an explicit length or count)
pipeline.length.guidance=Make the answer as long as the task requires and no longer; avoid filler, repetition and unnecessary introductions.

# S3: Token Budgeting — input budget per provider (characters / 4 \u2248 tokens)
pipeline.token.budget.openai=128000
pipeline.token.budget.claude=200000
pipeline.token.budget.gemini=1000000
