spring.application.name=GPT

# OpenAI (GPT-4o - latest stable GPT model)
spring.ai.openai.api-key=${OPENAI_KEY:${KEY:}}
spring.ai.openai.chat.options.model=gpt-4o

# Anthropic (Claude Opus 4.5 - latest stable Claude model)
spring.ai.anthropic.api-key=${ANTHROPIC_KEY:}
spring.ai.anthropic.chat.options.model=claude-opus-4-5

# Google GenAI (Gemini model compatible with v1beta generateContent)
spring.ai.google.genai.api-key=${GEMINI_KEY:}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash

# ── Prompt Transformation Pipeline ──────────────────────────────────────────

# T1: Instruction Scaffolding — prefix and suffix wrapped around the raw user message
pipeline.scaffolding.prefix=Your task is:
pipeline.scaffolding.suffix=Please complete this task clearly and accurately.

# T2: Role Conditioning — default persona applied when the request omits a role
pipeline.role.default=a helpful and precise AI assistant

# T7: Token Budgeting — maximum token budget per provider (characters / 4 \u2248 tokens)
pipeline.token.budget.openai=128000
pipeline.token.budget.claude=200000
pipeline.token.budget.gemini=1000000
